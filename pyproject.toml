# Python tooling for the repo (backend/ and api/). Runtime dependencies for
# Vercel live in requirements.txt; this [project] table mirrors them so tools
# that read pyproject.toml resolve the same set.
[project]
name = "mars-mission-simulator-api"
version = "4.0.0"
description = "FastAPI backend and Python mirror of the Mars mission physics engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "starlette==1.10.0",
    "pydantic>=2.9,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: ambiguous Unicode characters. The physics docstrings and comments
# deliberately use ×, −, ≈, μ, ∞ and similar symbols that mirror the JS sources.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# ruff format is Black-compatible.
quote-style = "double"
