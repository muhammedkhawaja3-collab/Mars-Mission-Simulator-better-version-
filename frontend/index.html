<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060b" />
    <meta
      name="description"
      content="Plan a crewed Earth-to-Mars mission and compare propulsion trade-offs with a patched-conic physics engine."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mars MMC" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-512x512.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Mars Mission Control</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown only until the app's JavaScript runs (no forced splash). -->
      <div class="boot" role="status">
        <p class="boot__title">Mars Mission Control</p>
        <p class="boot__text">Loading the mission planner…</p>
      </div>
    </div>
    <noscript>Mars Mission Control needs JavaScript to run its physics engine.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
