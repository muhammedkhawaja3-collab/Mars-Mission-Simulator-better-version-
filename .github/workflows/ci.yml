name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (ruff, pytest, Vercel entry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            backend/requirements-dev.txt
      # backend/requirements-dev.txt chains to backend/requirements.txt and the
      # root requirements.txt (the Vercel runtime set).
      - run: pip install -r requirements.txt -r backend/requirements-dev.txt
      # Ruff reads the root pyproject.toml and covers backend/ and api/.
      - run: ruff check .
      - run: ruff format --check .
      # Tests resolve shared/golden_cases.json relative to their own path.
      - run: python -m pytest
        working-directory: backend
      - name: Vercel entry point imports the app
        run: python -c "from api.index import app; assert app.title"
      - name: vercel.json is valid JSON
        run: python -m json.tool vercel.json > /dev/null
